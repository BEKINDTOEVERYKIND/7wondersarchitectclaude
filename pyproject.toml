[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenwa"
version = "0.1.0"
description = "Self-play reinforcement-learning AI (MCTS + neural network) for 2-player 7 Wonders: Architects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sevenwa = "sevenwa.cli:main"

[tool.setuptools.packages.find]
include = ["sevenwa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
